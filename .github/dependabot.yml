version: 2
# Security updates arrive as PRs (enable "Dependabot security updates" in repo settings too).
# cooldown: wait a few days before adopting a brand-new release, so a hijacked/malicious
# version is usually caught and yanked before it reaches you. Security fixes skip the wait.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

